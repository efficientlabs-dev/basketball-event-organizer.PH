server_name: "phantomznetwork.xyz"
pid_file: /data/homeserver.pid
public_baseurl: https://matrix.phantomznetwork.xyz/

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    resources:
      - names: [client, federation]
        compress: false

database:
  name: psycopg2
  args:
    user: synapse
    password: phantomz_db_2026
    database: synapse
    host: postgres
    cp_min: 2
    cp_max: 5

log_config: "/data/phantomznetwork.xyz.log.config"
media_store_path: /data/media_store
signing_key_path: "/data/phantomznetwork.xyz.signing.key"

registration_shared_secret: "phantomz_reg_secret_2026"
report_stats: false
enable_registration: false
enable_registration_without_verification: false

password_config:
  enabled: true
  localdb_enabled: true

encryption_enabled_by_default_for_room_type: all

federation_domain_whitelist: []

presence:
  enabled: false

retention:
  enabled: true
  default_policy:
    min_lifetime: 1d
    max_lifetime: 3d
  purge_jobs:
    - longest_max_lifetime: 3d
      interval: 12h

url_preview_enabled: false

rc_message:
  per_second: 5
  burst_count: 20

rc_login:
  address:
    per_second: 0.5
    burst_count: 5
  account:
    per_second: 0.5
    burst_count: 5

caches:
  global_factor: 0.5

enable_metrics: false
max_upload_size: 50M
max_image_pixels: 32M

user_directory:
  enabled: true
  search_all_users: true
  prefer_local_users: true

trusted_key_servers: []
suppress_key_server_warning: true
