<style type="text/css">
    .mx_Parent {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px 35px;
        color: #E0E0E0;
    }

    .mx_Logo {
        height: 64px;
        margin-top: 2px;
        filter: brightness(0) invert(1);
    }

    .mx_ButtonGroup {
        margin-top: 20px;
    }

    .mx_ButtonRow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin: 12px 0 0;
    }

    .mx_ButtonParent {
        display: flex;
        padding: 12px 28px;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.2s ease;
    }

    .mx_Header_title {
        font-size: 28px;
        font-weight: 700;
        margin: 24px 0 0;
        color: #FFFFFF;
        letter-spacing: -0.5px;
    }

    .mx_Header_title::after {
        content: "";
    }

    .mx_Header_subtitle {
        font-size: 14px;
        font-weight: normal;
        margin: 8px 0 0;
        color: #888;
    }

    .mx_ButtonSignIn {
        background-color: #7B68EE;
        color: white !important;
    }

    .mx_ButtonSignIn:hover {
        background-color: #6A5ACD;
    }

    .mx_ButtonCreateAccount {
        background-color: transparent;
        color: #7B68EE !important;
        border: 1px solid #7B68EE;
    }

    .mx_ButtonCreateAccount:hover {
        background-color: #7B68EE22;
    }

    .mx_SecondaryButton {
        background-color: #1A1A2E;
        color: #E0E0E0 !important;
        border: 1px solid #333;
    }

    .mx_SecondaryButton:hover {
        background-color: #2A2A4E;
    }

    .mx_WelcomePage:not(.mx_WelcomePage_loggedIn) .mx_WelcomePage_guestFunctions {
        display: none;
    }

    .mx_ButtonRow.mx_WelcomePage_guestFunctions {
        margin-top: 20px;
    }

    .mx_ButtonRow.mx_WelcomePage_guestFunctions > div {
        margin: 0 auto;
    }

    .mx_Tagline {
        font-size: 12px;
        color: #555;
        margin-top: 32px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    @media only screen and (max-width: 480px) {
        .mx_ButtonRow {
            flex-direction: column;
        }
    }
</style>

<div class="mx_Parent">
    <img src="$logoUrl" alt="$brand" class="mx_Logo" />
    <h1 class="mx_Header_title">_t("welcome_to_element")</h1>
    <h2 class="mx_Header_subtitle">The underground network for sovereign minds</h2>
    <div class="mx_ButtonGroup">
        <div class="mx_ButtonRow">
            <a href="#/login" class="mx_ButtonParent mx_ButtonSignIn">
                <div>_t("action|sign_in")</div>
            </a>
            <a href="#/register" class="mx_ButtonParent mx_ButtonCreateAccount">
                <div>_t("action|create_account")</div>
            </a>
        </div>
        <div class="mx_ButtonRow mx_WelcomePage_guestFunctions">
            <div>
                <a href="#/directory" class="mx_ButtonParent mx_SecondaryButton">
                    <div>_t("action|explore_rooms")</div>
                </a>
            </div>
        </div>
    </div>
    <div class="mx_Tagline">Sovereign &middot; Encrypted &middot; Free</div>
</div>
